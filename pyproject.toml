[project]
name = "open-ranking"
version = "0.0.1"
description = "Open Ranking: a reproducible wins-above-bubble ledger for the College Football Playoff, plus forecast models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.0",
    "polars>=1.12",
    "pyarrow>=17",
    "pyyaml>=6.0.4",
    "scipy>=1.14",
]

[project.scripts]
cfp = "cfp.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests excluded from the pre-commit fast run",
    "replay: point-in-time replay tests that need the data lake",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["reference", "lake"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["scipy.*", "duckdb.*", "pyarrow.*"]
ignore_missing_imports = true

# --- Dependency boundary (docs/SPEC.md DS-04, OR-12) --------------------------
# cfp.open_ranking may import only cfp.common, cfp.store.views, cfp.snapshot and cfp.rules. cfp.store.views
# imports nothing that can open the lake, so the transitive contract can forbid the lake itself.
[tool.importlinter]
root_package = "cfp"

[[tool.importlinter.contracts]]
name = "Open Ranking, snapshots and rules never reach the lake, forecasts, markets, scoring, gap, ingest or release"
type = "forbidden"
source_modules = ["cfp.open_ranking", "cfp.snapshot", "cfp.rules"]
forbidden_modules = [
    "cfp.forecast",
    "cfp.markets",
    "cfp.scoring",
    "cfp.gap",
    "cfp.ingest",
    "cfp.release",
    "cfp.store.asof",
    "cfp.store.lake",
    "cfp.store.pit",
]

[[tool.importlinter.contracts]]
name = "Open Ranking direct imports are allow-listed"
type = "forbidden"
source_modules = ["cfp.open_ranking"]
forbidden_modules = [
    "cfp.cli",
    "cfp.identity",
    "cfp.store.schemas",
    "cfp.store.types",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Shared foundations do not depend on products"
type = "forbidden"
source_modules = ["cfp.common", "cfp.rules", "cfp.snapshot", "cfp.store", "cfp.identity"]
forbidden_modules = ["cfp.open_ranking", "cfp.forecast", "cfp.markets", "cfp.scoring", "cfp.gap"]

[[tool.importlinter.contracts]]
name = "The Open Ranking's door (cfp.store.views) cannot open the lake"
type = "forbidden"
source_modules = ["cfp.store.views", "cfp.store.types"]
forbidden_modules = ["cfp.store.asof", "cfp.store.lake", "cfp.store.pit", "cfp.store.schemas"]

[[tool.importlinter.contracts]]
name = "Forecasts never import market code (prices are evaluation only)"
type = "forbidden"
source_modules = ["cfp.forecast"]
forbidden_modules = ["cfp.markets"]
